version: 1

# タスクと、それを実行する役割の対応。
#
# タスクは `research-plan.yaml` の task に `role:` を書いて自分の役割を宣言できる。
# 宣言が無いタスク（テンプレートから作った既存プロジェクト）のために、タスクIDと
# 題名からの対応を持つ。宣言が最優先で、次にID、次に題名、最後に default_role。

default_role: collector

by_task_id:
  TASK001: planner
  TASK002: collector
  TASK003: analyst

by_title_contains:
  - {match: "Validate intake", role: planner}
  - {match: "Collect", role: collector}
  - {match: "Analyze", role: analyst}
  - {match: "Critique", role: critic}
  - {match: "Translate", role: production-translator}
  - {match: "Verify", role: validator}

# 役割ごとに「手順書のどの段を読むか」「どこへ書いてよいか」「何が満たされたら完了か」。
#
# acceptance_checks はversioned typed gateであり、任意shell commandを置かない。
# pathはproject-relative、判定できない文（「十分に調べる」等）はここに置かない。

roles:
  planner:
    protocol_sections: [1, 2, 3]
    write_targets:
      - {path: "01_planning/question-register.yaml", record: question}
      - {path: "01_planning/research-plan.yaml", record: plan}
    acceptance_checks:
      - {id: AG-PLANNER-VALIDATE, kind: project_validate}
      - {id: AG-PLANNER-QUESTIONS, kind: collection_minimum, path: "01_planning/question-register.yaml", collection_key: questions, minimum: 1}

  collector:
    protocol_sections: [4, 5]
    write_targets:
      - {path: "02_evidence/evidence-ledger.jsonl", record: evidence, schema: "schemas/evidence.schema.json"}
      - {path: "02_evidence/source-ledger.jsonl", record: source}
    runtime_targets:
      - {path: "07_runtime/run-log.jsonl", namespace: harness, record: run-log-event, schema: "schemas/run-log-event.schema.json"}
    acceptance_checks:
      - {id: AG-COLLECTOR-VALIDATE, kind: project_validate}
      - {id: AG-COLLECTOR-EVIDENCE, kind: collection_minimum, path: "02_evidence/evidence-ledger.jsonl", minimum: 1}
      - {id: AG-COLLECTOR-SEARCH, kind: run_event_minimum, path: "07_runtime/run-log.jsonl", event_type: SEARCH_ATTEMPT, minimum: 1}
      - {id: AG-COLLECTOR-STOPPING, kind: stopping_evaluate}

  curator:
    protocol_sections: [5]
    write_targets:
      - {path: "02_evidence/evidence-ledger.jsonl", record: evidence, schema: "schemas/evidence.schema.json"}
      - {path: "06_governance/rights-register.yaml", record: right}
    acceptance_checks:
      - {id: AG-CURATOR-VALIDATE, kind: project_validate}

  analyst:
    protocol_sections: [6]
    write_targets:
      - {path: "03_knowledge/observations.jsonl", record: observation}
      - {path: "03_knowledge/claims.jsonl", record: claim, schema: "schemas/claim.schema.json"}
      - {path: "03_knowledge/relationships.jsonl", record: relationship}
      - {path: "03_knowledge/contradictions.jsonl", record: contradiction}
    acceptance_checks:
      - {id: AG-ANALYST-VALIDATE, kind: project_validate}
      - {id: AG-ANALYST-CLAIMS, kind: collection_minimum, path: "03_knowledge/claims.jsonl", minimum: 1}

  critic:
    protocol_sections: [6, 7]
    write_targets:
      - {path: "04_decisions/insight-register.yaml", record: insight, schema: "schemas/insight.schema.json"}
      - {path: "04_decisions/uncertainty-register.yaml", record: uncertainty}
      - {path: "04_decisions/rejected-options.yaml", record: rejected-option}
      - {path: "04_decisions/decision-log.yaml", record: decision, schema: "schemas/decision.schema.json"}
      - {path: "03_knowledge/prior-art.jsonl", record: prior-art, schema: "schemas/prior-art.schema.json"}
      - {path: "04_decisions/self-repetition-review.yaml", record: self-repetition-review, schema: "schemas/self-repetition-review.schema.json"}
      - {path: "04_decisions/cumulative-specificity-request.json", record: cumulative-specificity-request, schema: "schemas/cumulative-specificity-request.schema.json"}
    acceptance_checks:
      - {id: AG-CRITIC-VALIDATE, kind: project_validate}
      - {id: AG-CRITIC-REJECTED, kind: collection_minimum, path: "04_decisions/rejected-options.yaml", collection_key: rejected_options, minimum: 1}
      - {id: AG-CRITIC-UNCERTAINTY, kind: collection_minimum, path: "04_decisions/uncertainty-register.yaml", collection_key: uncertainties, minimum: 1}
      - {id: AG-CRITIC-PRIOR-ART, kind: collection_minimum, path: "03_knowledge/prior-art.jsonl", minimum: 1}
      - {id: AG-CRITIC-SELF-REVIEW, kind: collection_minimum, path: "04_decisions/self-repetition-review.yaml", collection_key: reviews, minimum: 1}

  production-translator:
    protocol_sections: [8]
    write_targets:
      - {path: "05_production/production-requirements.yaml", record: requirement, schema: "schemas/requirement.schema.json"}
      - {path: "05_production/acceptance-tests.yaml", record: acceptance-test}
      - {path: "05_production/prototype-plans.yaml", record: prototype-plan, schema: "schemas/prototype-plan.schema.json"}
      - {path: "04_decisions/production-hypotheses.yaml", record: production-hypothesis, schema: "schemas/production-hypothesis.schema.json"}
      - {path: "04_decisions/hypothesis-comparison.yaml", record: hypothesis-comparison, schema: "schemas/hypothesis-comparison.schema.json"}
      - {path: "04_decisions/decision-log.yaml", record: decision, schema: "schemas/decision.schema.json"}
      - {path: "05_production/visual-language.yaml", record: visual-language, schema: "schemas/visual-language.schema.json"}
      - {path: "05_production/creative-direction.md", record: prose}
    acceptance_checks:
      - {id: AG-TRANSLATOR-VALIDATE, kind: project_validate}
      - {id: AG-TRANSLATOR-MEDIUM, kind: medium_decision}
      - {id: AG-TRANSLATOR-REQUIREMENTS, kind: collection_minimum, path: "05_production/production-requirements.yaml", collection_key: requirements, minimum: 1}
      - {id: AG-TRANSLATOR-HYPOTHESIS, kind: hypothesis_selection}
      - {id: AG-TRANSLATOR-VISUAL, kind: collection_minimum, path: "05_production/visual-language.yaml", collection_key: prohibited_expressions, minimum: 1}

  validator:
    protocol_sections: [9, 10]
    write_targets:
      - {path: "06_governance/privacy-review.yaml", record: review}
      - {path: "06_governance/safety-risk-register.yaml", record: risk}
    runtime_targets:
      - {path: "07_runtime/research-state.json", namespace: harness, record: state}
    acceptance_checks:
      - {id: AG-VALIDATOR-VALIDATE, kind: project_validate}
      - {id: AG-VALIDATOR-GRAPH, kind: graph_current}
      - {id: AG-VALIDATOR-COMPLETION, kind: completion_status}
