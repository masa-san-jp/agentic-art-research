version: 1
git_storage:
  PRIVATE_RAW: prohibited
  PRIVATE_DERIVED: conditional
  PROJECT_INTERNAL: allowed
  PUBLIC_CITABLE: allowed
  RESTRICTED: prohibited
forbidden_extensions:
  - .eml
  - .mbox
  - .ics
  - .pst
  - .ost
  - .key
  - .pem
  - .p12
  - .pfx
  - .wav
  - .m4a
  - .mp3
forbidden_filenames:
  - .env
  - .env.*
  - credentials.json
  - credentials.*
  - service-account.json
  - id_rsa
  - id_rsa.*
  - id_ed25519
  - id_ed25519.*
secret_patterns:
  - id: private-key-block
    pattern: '-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----'
  - id: aws-access-key
    pattern: '\bAKIA[0-9A-Z]{16}\b'
  - id: github-token
    pattern: '\bgh[pousr]_[A-Za-z0-9_]{20,}\b'
  - id: openai-style-key
    pattern: '\bsk-[A-Za-z0-9]{20,}\b'
  - id: bearer-token
    pattern: '(?i)\bBearer\s+[A-Za-z0-9._-]{20,}'
  - id: generic-secret-assignment
    pattern: '(?i)\b(?:api[_-]?key|secret|token|password)\s*[:=]\s*[A-Za-z0-9/+=._-]{20,}'
unsafe_archive_extensions: [.zip, .tar, .tar.gz, .tgz, .tar.bz2, .tbz2, .tar.xz, .txz]
archive_limits:
  max_members: 1000
  max_archive_bytes: 52428800
  max_member_bytes: 20971520
approved_snapshot_requires:
  - rights_status
  - redistribution
  - content_hash
  - acquired_at
external_actions_requiring_human:
  - publish
  - submit
  - send
  - purchase
  - contract
  - delete
