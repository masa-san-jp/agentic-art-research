version: 1
defaults:
  max_search_strategies_per_question: 3
  max_sources_reviewed_per_question: 30
  max_identical_failure_retries: 2
  saturation_rounds_without_new_evidence: 2
  minimum_independent_secondary_sources_when_no_primary: 2
  default_sufficient_answers: 1
  allow_complete_with_gaps: true
  require_terminal_state: true
  completion_minimums:
    evidence: 30
    claims: 18
    insights: 4
    decisions: 3
    requirements: 4
  completion_required_records:
    - rejected_options
    - uncertainty
    - prior_art
    - self_repetition_review
  task_runtime:
    # 既定を延ばしても「十分長い」は言えない。長い作業は心拍で lease を延ばす
    # （tools/task_runtime.py heartbeat）。推奨は既定の半分ごと。
    default_lease_seconds: 1800
    heartbeat_interval_seconds: 900
    default_max_attempts: 3
    retryable_failure_classes: [TRANSIENT, TIMEOUT, RATE_LIMIT, LEASE_EXPIRED, VALIDATION]
    terminal_failure_classes: [PERMANENT, AUTHORIZATION, DEPENDENCY_FAILED]
  supervisor:
    max_runtime_seconds: 14400
    max_tasks: 100
    max_consecutive_no_progress: 3
    shutdown_grace_seconds: 5
    heartbeat_interval_seconds: 900
    heartbeat_lease_seconds: 1800
    worker_timeout_seconds: 300
    retry_backoff_seconds:
      TRANSIENT: [1, 2, 4]
      TIMEOUT: [1, 2, 4]
      RATE_LIMIT: [2, 4, 8]
      LEASE_EXPIRED: [1, 2, 4]
      VALIDATION: [1, 2, 4]
      PERMANENT: [0]
      AUTHORIZATION: [0]
      DEPENDENCY_FAILED: [0]
    worker_failure_classes:
      WORKER-TIMEOUT: TIMEOUT
      WORKER-EXIT: TRANSIENT
      WORKER-COMMAND: PERMANENT
      WORKER-PROTOCOL: PERMANENT
      WORKER-OUTPUT-LIMIT: VALIDATION
      WORKER-SECRET-OUTPUT: AUTHORIZATION
      WORKER-CAPABILITY: AUTHORIZATION
overrides_require:
  - reason
  - approved_by
  - approved_at
