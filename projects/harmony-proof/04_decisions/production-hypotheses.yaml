hypotheses:
- id: PH001
  title: 距離が条件になる像
  proposition: 必要な距離まで離れたときにだけ像が調和し、近づくと要素へ分解する状態を、実空間で成立させる。
  source_decision_ids:
  - DC001
  - DC002
  source_insight_ids:
  - IN001
  - IN003
  - IN004
  intended_experience:
  - 近づいたときに像が壊れる
  - 離れたときに像が戻る
  - 自分の位置が作品の状態を決めていると気づく
  includes:
  - 鑑賞者との距離の計測
  - 距離に応じた像の分解と再構成
  - 分解された要素そのものの提示
  excludes:
  - 距離の概念の言語による説明
  - 点描技法の再現そのもの
  differentiation:
    precedent_refs: []
    statement: 点描は距離を成立条件として持つが主題化していない。ここでは距離を鑑賞者が動かせる変数にして、成立と破壊の両方を体験させる。
  feasibility:
    technical: 距離計測と実時間の像生成。既存のローカル生成環境で試作できる。
    cost_band: MEDIUM
    duration_band: WEEKS
    venue_dependency: HIGH
    rights_status: CLEAR
    safety_status: CLEAR
  uncertainties:
  - id: U002
    statement: 近づくと壊れる、が当事者の記述からの推論であり知覚実験に当たっていない。
    severity: MAJOR
    prototype_plan_ids:
    - PP001
    external_validation_reason: null
  recommendation: RECOMMENDED
  status: ADOPTED
- id: PH002
  title: 運ぶ仕組みを見せる
  proposition: 作品そのものではなく、作品を国境や制度を越えて運んだ仕組みの側を提示する。
  source_decision_ids:
  - DC003
  source_insight_ids:
  - IN002
  intended_experience:
  - 伝播が様式ではなく制度で起きたと気づく
  includes:
  - 展覧会組織の記録の提示
  excludes:
  - 鑑賞距離の操作
  differentiation:
    precedent_refs: []
    statement: 制度史の展示に近く、作品としての差が小さい。
  feasibility:
    technical: 資料提示のみ。実現は容易。
    cost_band: LOW
    duration_band: DAYS
    venue_dependency: LOW
    rights_status: REVIEW_REQUIRED
    safety_status: CLEAR
  uncertainties:
  - id: U004
    statement: 鑑賞者の位置が変わらないため、命題の核に触れない。
    severity: CRITICAL
    prototype_plan_ids: []
    external_validation_reason: この案は採らないため試作しない。
  recommendation: REJECTED
  status: REJECTED
