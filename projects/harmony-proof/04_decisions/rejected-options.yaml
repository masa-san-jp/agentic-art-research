rejected_options:
- id: RO001
  option: 点描そのものを再現した静止画をつくる
  reason: 技法の再現は「調和がどこに在るか」を示さない。見る者の位置を作品の条件にしないと、命題の核が絵の中に入らない。
  evidence_ids:
  - EV002
  - EV003
- id: RO002
  option: ブリュッセルへの伝播を年表として見せる
  reason: 伝播の事実は制度の記録として既にある。作品が年表を繰り返しても、鑑賞者の位置は動かない。
  evidence_ids:
  - EV015
  - EV024
- id: RO003
  option: デジタル教科書を主題として前面に出す
  reason: 制度文書しか読めておらず（U001）、主題として支えるには証拠が薄い。媒体の置き換えという構造だけを使う。
  evidence_ids:
  - EV025
