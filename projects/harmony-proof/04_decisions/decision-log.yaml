decisions:
- id: DC001
  question: この作品で「調和」をどこに置くか。画面の上か、鑑賞者の位置か。
  selected_option: 鑑賞者の位置に置く。必要な距離まで離れたときにだけ調和が成立し、近づくと成立しない状態を作る。
  rejected_options:
  - 画面上で調和した像を提示する
  - 調和を主題として説明的に描く
  insight_ids:
  - IN001
  - IN003
  evidence_ids:
  - EV002
  - EV003
  - EV008
  reason: Signac は分割の目的を色の調和と定義し、Fénéon は分離した色が網膜で再合成されると書いている。この技法の調和は物の側に無く、必要な後退距離でのみ成立する。画面上で調和させると、調和の所在という核が消える。
  uncertainty: 近づくと壊れる、は当事者の記述からの推論で、知覚実験の記録には当たっていない（U002）。
  review_trigger: 視距離と点描の知覚に関する実験研究に当たった時点。
  authority: agent-recommended
  status: ADOPTED
- id: DC002
  question: 媒体（medium）を何にするか。
  selected_option: 分割された要素で構成した大判の静止画（プリント）。要素の寸法を鑑賞距離から逆算して決める。
  rejected_options:
  - 距離を実測して状態が変わる実空間のインスタレーション映像
  - 距離の概念を説明する動画
  - Webブラウザ上のインタラクティブ作品
  insight_ids:
  - IN001
  - IN004
  evidence_ids:
  - EV003
  - EV002
  reason: 当初は静止画を『距離を条件にできるが状態を変えられない』として棄却し、実空間のインスタレーションを選んでいた。制作結果（PR001・観察 OB001）でこの前提が否定された。分割された要素は、装置なしで鑑賞者の位置によって状態を変える——離れれば像として成立し、近づけば要素へ分離する。距離は要素の寸法として作品に入る（要素
    = 距離 × 0.000291・OB002）。センサと電源と設営を要する媒体は、同じことをより多くの前提の上で行うことになる。
  uncertainty: 実寸の印刷物で人が歩いて確かめていない（GP001）。4.07mが実物で成り立つかは未確認。
  review_trigger: 長辺1528mmで印刷し、同一の鑑賞者が2位置で観察した時点。
  authority: agent-recommended
  status: ADOPTED
- id: DC003
  question: 伝播（Les XX / デジタル教科書）を作品にどう入れるか。
  selected_option: 主題にはせず、構造として使う。作品を運ぶ仕組みの側を可視化する層を1つ置く。
  rejected_options:
  - 伝播を年表として提示する
  - デジタル教科書を主題として前面に出す
  insight_ids:
  - IN002
  evidence_ids:
  - EV015
  - EV024
  - EV025
  reason: 伝播を成立させたのは様式でなく制度である（IN002）。年表の提示は鑑賞者の位置を動かさず、デジタル教科書は制度文書しか読めていないため主題として支えられない（U001）。
  uncertainty: 可視化の層が、距離という中心を薄めうる。
  review_trigger: 試作で中心が薄まったと判断した時点。
  authority: agent-recommended
  status: ADOPTED
- id: DC004
  question: 制作の結果が判断の前提を否定したとき、前の判断をどう扱うか。
  selected_option: 棄却の理由が誤りだったことを明記して書き直し、実物を判断の根拠として記録する。
  rejected_options:
  - 前の判断を残したまま、作った物を逸脱として扱う
  - 前の判断を黙って差し替える
  insight_ids:
  - IN001
  evidence_ids:
  - EV002
  - EV003
  reason: 逸脱として扱えば、実物が示したことが判断に入らない。黙って差し替えれば、なぜ変わったかが残らない。棄却の理由は一次資料の読み違いではなく、読んだうえで媒体の判断に反映し損ねたものだったので、そこを名指しで直す。
  uncertainty: 実寸での確認が済むまで、新しい理由も実物1件に依っている。
  review_trigger: AT001 を実寸で実施した時点。
  authority: agent-recommended
  status: ADOPTED
