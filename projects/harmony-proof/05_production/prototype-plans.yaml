prototype_plans:
- id: PP001
  hypothesis_id: PH001
  question: 鑑賞距離を変えたとき、像が壊れて戻ることを鑑賞者が自分の位置の結果として認識するか。
  uncertainty_ids:
  - U002
  method: 1.5m幅で印刷し、4mの位置と手を伸ばせる位置の2箇所で観察してもらい、何が起きたと思うかを聞き取る。装置は使わない。
  inputs:
  - 入稿データ「必要な後退-印刷原版-300dpi.tif」（17717×12026px・1500×1018mm・300dpi・要素1辺14px＝1.164mm）
  - 反射しない面への出力（マット紙またはマットラミネート。光沢面は要素の分離が反射で消える）
  - 正面に4.0m以上の空きが取れる壁面と、鑑賞者が近接位置まで歩ける床
  - 2位置の観察手順（4.0mの位置と手を伸ばせる位置の2箇所・説明は事前にしない）
  - 聞き取りの記録用紙
  constraints:
  - 正面に4m以上の空きが要る
  - 鑑賞者は事前に仕組みの説明を受けない
  tasks:
  - id: PT001
    title: 300dpi の原版を1.5m幅で印刷し、反射しない面で掲示する
    depends_on: []
    completion_condition: 要素が潰れずに分離して見える状態で掲示できた
    effect_type: PHYSICAL_EXTERNAL
  - id: PT002
    title: 2位置での観察を行い、聞き取りを記録する
    depends_on:
    - PT001
    completion_condition: 観察記録が2位置分そろい、状態の差が記録されている
    effect_type: PHYSICAL_EXTERNAL
  acceptance_test_ids:
  - AT001
  - AT002
  expected_evidence: 2位置の観察記録と、距離の実測値の時系列
  estimated_cost_band: LOW
  estimated_duration_band: DAYS
  executor_capability: 大判出力を入稿・掲示でき、観察の聞き取りを記録できること
  status: PLANNED
- id: PP002
  hypothesis_id: PH001
  question: 近距離のとき、要素は実際に分離して識別できるか。生成過程は後から復元できるか。
  uncertainty_ids:
  - U003
  method: 規定距離未満の状態の出力フレームを取得して要素の分離を目視で確認し、同じ生成の実行ログからモデル・シード・プロンプト・データセットを復元する。
  inputs:
  - 試作機の出力フレーム
  - 生成の実行ログ
  constraints:
  - 試作機が動いていること
  tasks:
  - id: PT003
    title: 近距離フレームを取得して要素の分離を確認する
    depends_on: []
    completion_condition: 規定距離未満のフレームで要素が分離して識別できることを記録した
    effect_type: READ_ONLY
  - id: PT004
    title: 実行ログから生成過程を復元する
    depends_on:
    - PT003
    completion_condition: 無作為の生成物5件でモデル・シード・プロンプト・データセットを特定できた
    effect_type: READ_ONLY
  - id: PT005
    title: 判断が参照する証拠が実在し一次資料であることを照合する
    depends_on: []
    completion_condition: DC001 が参照する証拠がすべて evidence-ledger に実在し一次資料である
    effect_type: READ_ONLY
  acceptance_test_ids:
  - AT003
  - AT005
  - AT006
  expected_evidence: 近距離フレームの標本、生成過程の復元記録、判断と証拠の照合表
  estimated_cost_band: LOW
  estimated_duration_band: DAYS
  executor_capability: 試作機の出力とログを扱えること
  status: PLANNED
