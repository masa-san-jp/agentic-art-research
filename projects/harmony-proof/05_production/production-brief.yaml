schema_version: 1.0.0
brief_id: PB001
revision: 1
completion_image:
  encounter:
  - 入ってきた人は、離れた位置から像が像として立っているのを見る。
  - 近づくと像がほどけて、色の要素が別々に見えはじめる。
  - 下がると像が戻る。自分が下がったことで戻った、と分かる。
  position: 入場者は像の正面を、規定距離（数メートル）から手を伸ばせる距離まで自由に往復する。
  first_seconds: 最初の数秒で、離れて見えているものが一つの像だと分かる。
  after_30s: 30秒後には、近づくほど像が壊れることに気づき、自分の位置と像の状態が連動していると分かる。
  after_3min: 3分後には、像の調和が画面の側ではなく自分の立つ位置にあったことが残る。
theme:
  field: 鑑賞距離と、調和が成立する場所
  stands_against: 作品に近づくほどよく見える、という展示の前提に対して立つ。近さは理解の深さだと扱われている。
  difference: 距離を主題として語るのではなく、距離を作品の成立条件そのものにして、近づいた人の手元で調和が壊れる形にする。
  why_now: 画面に近づくほど情報が得られるという習慣が、鑑賞の既定になっているから。
message:
  claim: 調和は物の側にはない。離れて立った人の目の中にだけ成立していて、距離を詰めるとそれは壊れる。
  who_disagrees: 作品の価値は物の中にあり、近づいて細部を見るほど理解が深まると考える鑑賞者と展示設計者。
  denies: 作品に近づくことが常に鑑賞の深化である、という前提を否定する。
  shown_not_told: 説明を読ませず、鑑賞者が自分で近づいて像が壊れ、下がって戻る往復を体験させることで示す。
concept:
  mechanism: 鑑賞者との距離を実測し、その値で像の分解と再構成を制御する。規定距離では要素が光学的に合成された像として成立し、距離が縮むほど要素が分離して個別に知覚される。新印象派が筆触の寸法で固定していた成立条件を、鑑賞者が動かせる変数にする。
  without_the_technique: CEASES_TO_WORK
  precedents:
  - reference: prior-art/PA001
    difference: 点描では鑑賞距離が成立条件として働いていたが、作品はそれを主題化していない。ここでは距離を鑑賞者が動かせる変数にして、成立と破壊の両方を体験させる。
  - reference: prior-art/PA004
    difference: エージェント駆動という系譜は同じだが、見せるのは駆動そのものではなく、調和がどこに成立しているかである。
  self_repetition_risk:
    reference: self-repetition-review/SR001
    assessment: エージェント駆動という枠組みは過去作と同じ系譜にあるが、中心は駆動の見せ方ではなく調和が鑑賞者の位置にしか成立しないという構造で、そこは反復していない。
research_summary:
  questions:
  - 新印象派は鑑賞者の立つ距離を作品の成立条件としてどう規定していたか。
  - 新印象派はブリュッセルへどの経路で伝播し、受け入れ側で何が変わったか。
  - 日本のデジタル教科書の実用採用はいまどの段階にあり、採用の可否を決めているのは何か。
  what_was_read: 一次資料31件。Signac『ドラクロワから新印象主義へ』と Fénéon『1886年の印象派』をGallica の全文検索でページ単位に特定して読み、Les
    XX の記録、Rood の色彩科学、文部科学省のデジタル教科書関連ページに当たった。二次情報のまま数字や条件は書いていない。
  what_came_out: Signac は分割の目的を「色の力と調和」と定義し、Fénéon は分離された色が網膜の上で再合成されると書き、Signac は筆触の小ささを「必要な後退の位置で」再構成するためと説明していた。この技法の調和は物の側になく、離れて立った者の目の中にだけ成立し、距離を詰めると壊れる。ブリュッセルへの伝播を運んだのは様式ではなく展覧会組織という制度だった。
  what_is_not_settled: 「近づくと壊れる」は当事者の記述からの推論で、視距離を変えた知覚実験には当たっていない。デジタル教科書は制度文書までで、教室で採用可否を決めている要因に届いていない。
