name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python3 -m pip install -r requirements.txt
      - run: python3 -m compileall -q tools tests
      - run: python3 tools/validate.py --check
      - run: python3 tools/security_check.py --check
      - run: python3 tools/chaos_check.py
      - run: python3 tools/docs_check.py --check
      - run: python3 -m unittest discover -s tests -v
      - run: python3 tools/build_graph.py --check

